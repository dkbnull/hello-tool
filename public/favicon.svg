<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    <!-- 背景方形，圆弧20 -->
    <rect x="10" y="10" width="180" height="180" rx="20" fill="white"/>

    <!-- 图表节点 -->
    <rect x="40" y="40" width="40" height="40" rx="8" fill="#4CAF50"/>
    <rect x="120" y="40" width="40" height="40" rx="8" fill="#4CAF50"/>
    <rect x="40" y="120" width="40" height="40" rx="8" fill="#4CAF50"/>
    <rect x="120" y="120" width="40" height="40" rx="8" fill="#4CAF50"/>

    <!-- 连接线 -->
    <path d="M80 60 L120 60" stroke="#4CAF50" stroke-width="5"/>
    <path d="M60 80 L60 120" stroke="#4CAF50" stroke-width="5"/>
    <path d="M80 140 L120 140" stroke="#4CAF50" stroke-width="5"/>
    <path d="M140 80 L140 120" stroke="#4CAF50" stroke-width="5"/>
</svg>